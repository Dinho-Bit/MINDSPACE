<!-- ═══════════════════════════════════════
     AUTH ENGINE — JavaScript profesional
     Usa SubtleCrypto (Web Crypto API) para
     hash seguro con PBKDF2 + sal aleatoria.
     Tokens de sesión firmados con timestamp.
     Nunca borra usuarios existentes.
════════════════════════════════════════ -->
<script>
/* ─────────────────────────────────────
   SM_AUTH — Motor de autenticación
   Almacenamiento: localStorage
   Keys:
     sm_db_users   → { [uid]: UserRecord }
     sm_db_session → SessionRecord | null
   UserRecord: { uid, name, initials, avatar,
     tz, saltHex, hashHex, createdAt }
   SessionRecord: { uid, token, issuedAt, expiresAt }
───────────────────────────────────── */
const SM_AUTH = (() => {
  const USERS_KEY   = 'sm_db_users';
  const SESSION_KEY = 'sm_db_session';
  const SESSION_TTL = 7 * 24 * 60 * 60 * 1000; // 7 days

  /* ── Utilidades crypto ── */
  function bytesToHex(buf) {
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function hexToBytes(hex) {
    const arr = new Uint8Array(hex.length / 2);
    for (let i = 0; i < arr.length; i++) arr[i] = parseInt(hex.slice(i*2, i*2+2), 16);
    return arr;
  }
  function randomHex(n) {
    const buf = new Uint8Array(n);
    crypto.getRandomValues(buf);
    return bytesToHex(buf);
  }

  /* ── PBKDF2: hash seguro con sal ── */
  async function hashPassword(password, saltHex) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']
    );
    const bits = await crypto.subtle.deriveBits(
      { name:'PBKDF2', salt: hexToBytes(saltHex), iterations: 100000, hash:'SHA-256' },
      keyMaterial, 256
    );
    return bytesToHex(bits);
  }

  /* ── Persistencia segura ── */
  function loadUsers() {
    try { const raw = localStorage.getItem(USERS_KEY); return raw ? JSON.parse(raw) : {}; }
    catch { return {}; }
  }
  function saveUsers(users) {
    try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); } catch {}
  }
  function loadSession() {
    try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
    catch { return null; }
  }
  function saveSession(s) {
    try { localStorage.setItem(SESSION_KEY, s ? JSON.stringify(s) : null); } catch {}
  }

  /* ── API pública ── */
  return {
    /* Registrar nuevo usuario */
    async register(name, password) {
      const trimmed = name.trim();
      if (trimmed.length < 2) throw new Error('El nombre debe tener al menos 2 caracteres.');
      if (password.length < 8) throw new Error('La contraseña debe tener mínimo 8 caracteres.');

      const users = loadUsers();
      const nameLower = trimmed.toLowerCase();
      const exists = Object.values(users).find(u => u.name.toLowerCase() === nameLower);
      if (exists) throw new Error('Ese nombre de usuario ya está en uso.');

      const uid     = 'u_' + Date.now() + '_' + randomHex(4);
      const saltHex = randomHex(16);
      const hashHex = await hashPassword(password, saltHex);
      const initials = trimmed.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);

      const user = { uid, name: trimmed, initials, avatar: null, tz: 'America/Bogota', saltHex, hashHex, createdAt: Date.now() };
      users[uid] = user;
      saveUsers(users);

      // Inicializar datos vacíos
      try { if (!localStorage.getItem(`sm_${uid}_diary`)) localStorage.setItem(`sm_${uid}_diary`, '[]'); } catch {}
      try { if (!localStorage.getItem(`sm_${uid}_posts`)) localStorage.setItem(`sm_${uid}_posts`, '[]'); } catch {}
      try { if (!localStorage.getItem(`sm_${uid}_memory`)) localStorage.setItem(`sm_${uid}_memory`, JSON.stringify({ facts: [], lastSummary: null, sessionsCount: 0 })); } catch {}

      const session = { uid, token: randomHex(32), issuedAt: Date.now(), expiresAt: Date.now() + SESSION_TTL };
      saveSession(session);
      return this._publicUser(user);
    },

    /* Iniciar sesión */
    async login(name, password) {
      const users = loadUsers();
      const nameLower = name.trim().toLowerCase();
      const user = Object.values(users).find(u => u.name.toLowerCase() === nameLower);
      if (!user) throw new Error('Usuario no encontrado.');

      const hashHex = await hashPassword(password, user.saltHex);
      if (hashHex !== user.hashHex) throw new Error('Contraseña incorrecta.');

      const session = { uid: user.uid, token: randomHex(32), issuedAt: Date.now(), expiresAt: Date.now() + SESSION_TTL };
      saveSession(session);
      return this._publicUser(user);
    },

    /* Verificar sesión activa (auto-login) */
    async resumeSession() {
      const session = loadSession();
      if (!session) return null;
      if (Date.now() > session.expiresAt) { saveSession(null); return null; }
      const users = loadUsers();
      const user = users[session.uid];
      if (!user) { saveSession(null); return null; }
      // Renovar token
      session.expiresAt = Date.now() + SESSION_TTL;
      saveSession(session);
      return this._publicUser(user);
    },

    /* Cerrar sesión */
    logout() { saveSession(null); },

    /* Verificar si nombre existe (para "olvidé contraseña") */
    checkUserExists(name) {
      const users = loadUsers();
      return !!Object.values(users).find(u => u.name.toLowerCase() === name.trim().toLowerCase());
    },

    /* Actualizar perfil */
    updateProfile(uid, changes) {
      const users = loadUsers();
      if (!users[uid]) return;
      Object.assign(users[uid], changes);
      if (changes.name) {
        users[uid].initials = changes.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
      }
      saveUsers(users);
      return this._publicUser(users[uid]);
    },

    /* Retorna usuario sin datos sensibles */
    _publicUser(u) {
      const { saltHex, hashHex, ...pub } = u;
      return pub;
    }
  };
})();

/* ─────────────────────────────────────
   SM_DATA — Datos del usuario con
   protección contra corrupción
───────────────────────────────────── */
const SM_DATA = {
  _key: (uid, s) => `sm_${uid}_${s}`,
  get(uid, key, def = null) {
    try {
      const v = localStorage.getItem(this._key(uid, key));
      return v !== null ? JSON.parse(v) : def;
    } catch { return def; }
  },
  set(uid, key, val) {
    try { localStorage.setItem(this._key(uid, key), JSON.stringify(val)); } catch {}
  },
  /* Memoria semántica del chat */
  getMemory(uid) {
    return this.get(uid, 'memory', { facts: [], lastSummary: null, sessionsCount: 0 });
  },
  saveMemory(uid, mem) {
    this.set(uid, 'memory', mem);
  },
  /* Chat: últimos N msgs para contexto */
  getChat(uid, name) {
    const def = [{ role:'assistant', content:`Hola ${name} 🌿 Soy Saphira, tu compañera de bienestar. ¿Cómo te sientes en este momento?`, ts: Date.now() }];
    return this.get(uid, 'chat', def);
  },
  saveChat(uid, msgs) {
    // Guardar máximo 200 mensajes (los más recientes)
    const slice = msgs.slice(-200);
    this.set(uid, 'chat', slice);
  }
};
</script>

/* ── HELPERS ── */
function getDaySeed(tz){const d=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return d.split('-').join('');}
function seededIdx(seed,len){let h=0;for(let i=0;i<seed.length;i++){h=(Math.imul(31,h)+seed.charCodeAt(i))|0;}return Math.abs(h)%len;}
const getDailyQuote=(tz)=>QUOTES[seededIdx(getDaySeed(tz)+'q',QUOTES.length)];
const getDailyRes=(tz)=>RESOURCES[seededIdx(getDaySeed(tz)+'r',RESOURCES.length)];
function getDailyMotiv(tz){
  const ex=[{emoji:"💬",title:"Palabra del día",text:"Resiliencia: la capacidad de recuperarse y seguir adelante."},{emoji:"🌟",title:"Dato de bienestar",text:"Reír 15 minutos al día reduce hasta un 40% el estrés."},{emoji:"🧠",title:"Curiosidad mental",text:"La meditación de 10 min puede cambiar estructuras cerebrales en 8 semanas."},{emoji:"💡",title:"Reflexión breve",text:"¿Qué es lo más pequeño que podrías hacer hoy por tu bienestar?"},{emoji:"🌈",title:"Recordatorio",text:"Está bien no tener todo resuelto. La vida no es lineal y eso es humano."}];
  return ex[seededIdx(getDaySeed(tz)+'m',ex.length)];
}

/* ── SISTEMA DE RACHAS (streak) ──
   Al guardar una entrada del diario se registra la fecha (según
   la zona horaria del usuario) y se compara con la última fecha
   registrada: si es consecutiva, la racha aumenta; si hay un
   salto de día, se reinicia en 1. Persistencia en localStorage
   vía SM_DATA (misma capa que el resto de la app). ── */
function getDaySeedForDate(date,tz){return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(date).split('-').join('');}
function getStreakData(uid){return SM_DATA.get(uid,'streak',{count:0,lastDate:null});}
function updateStreak(uid,tz){
  const streak=getStreakData(uid);
  const todaySeed=getDaySeedForDate(new Date(),tz);
  if(streak.lastDate===todaySeed)return streak; // ya se registró hoy, no cambia
  const yesterdaySeed=getDaySeedForDate(new Date(Date.now()-86400000),tz);
  const newCount=streak.lastDate===yesterdaySeed?(streak.count||0)+1:1;
  const newStreak={count:newCount,lastDate:todaySeed};
  SM_DATA.set(uid,'streak',newStreak);
  return newStreak;
}

/* ── SISTEMA DE MONEDAS (coins) ──
   Saldo persistente por usuario en localStorage vía SM_DATA. ── */
function getCoins(uid){return SM_DATA.get(uid,'coins',0);}
function addCoins(uid,amount){
  const next=getCoins(uid)+amount;
  SM_DATA.set(uid,'coins',next);
  return next;
}

/* ── ANTHROPIC API ──
   Claude.ai inyecta automáticamente x-api-key.
   El header anthropic-dangerous-direct-browser-access
   desbloquea CORS desde el navegador.
── */
async function callAI(messages, system, maxTokens=800) {
  const body = { model:"claude-sonnet-4-20250514", max_tokens: maxTokens, system, messages };
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.text().catch(()=>'');
    throw new Error(`API ${res.status}: ${err.slice(0,200)}`);
  }
  const data = await res.json();
  return data.content?.[0]?.text || "";
}

/* ── AVATAR ── */
function Av({user,size=40,onClick}){
  const st={width:size,height:size,cursor:onClick?'pointer':'default',flexShrink:0};
  if(user.avatar)return<div className="av" style={st} onClick={onClick}><img src={user.avatar} style={{width:'100%',height:'100%',objectFit:'cover'}}/></div>;
  return<div className="av" style={st} onClick={onClick}><span style={{fontSize:size*.38,fontWeight:700,color:'white'}}>{user.initials||user.name?.[0]||'?'}</span></div>;
}

  const[lPwd,setLPwd]=useState('');
  const[showLP,setShowLP]=useState(false);
  // register fields
  const[rName,setRName]=useState('');
  const[rPwd,setRPwd]=useState('');
  const[rConf,setRConf]=useState('');
  const[showRP,setShowRP]=useState(false);
  // forgot
  const[fName,setFName]=useState('');
  const[fOk,setFOk]=useState('');
  // error
  const[err,setErr]=useState('');

  const clr=()=>setErr('');

  const doLogin=async()=>{
    if(!lName.trim()||!lPwd){setErr('Completa todos los campos.');return;}
    setLoading(true);setErr('');
    try{const u=await SM_AUTH.login(lName,lPwd);onLogin(u);}
    catch(e){setErr(e.message);}
    setLoading(false);
  };

  const doRegister=async()=>{
    if(rPwd!==rConf){setErr('Las contraseñas no coinciden.');return;}
    setLoading(true);setErr('');
    try{const u=await SM_AUTH.register(rName,rPwd);onLogin(u);}
    catch(e){setErr(e.message);}
    setLoading(false);
  };

    setFOk('');setErr('');

    const exists=SM_AUTH.checkUserExists(fName);

    setFOk('✓ Tu cuenta existe. Para restablecer la contraseña, contacta al administrador de la plataforma.');

          </div>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   AI CHAT con memoria persistente
   
   Sistema de memoria:
   - memory.facts: datos clave extraídos de conversaciones pasadas
     (nombre, emociones frecuentes, temas recurrentes, etc.)
   - memory.lastSummary: resumen compacto de la última sesión
   - memory.sessionsCount: número de sesiones

   Al iniciar: Saphira recibe el contexto de memoria en el system prompt
   Al cerrar chat: extrae hechos nuevos y actualiza memoria
══════════════════════════════════════ */
function AIChat({user,msgs,setMsgs,memory,setMemory,onClose}){
  const[inp,setInp]=useState('');
  const[loading,setLoading]=useState(false);
  const[showHist,setShowHist]=useState(false);
  const[extracting,setExtracting]=useState(false);
  const bottomRef=useRef(null);
  const inpRef=useRef(null);
  const sessionStartRef=useRef(msgs.length); // índice donde empezó esta sesión

  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[msgs,loading]);

  /* Construir system prompt con memoria */
  function buildSystemPrompt(){
    let memCtx='';
    if(memory.facts&&memory.facts.length>0){
      memCtx=`\n\nINFORMACIÓN QUE RECUERDAS DEL USUARIO (de conversaciones anteriores):\n${memory.facts.map(f=>`- ${f}`).join('\n')}\nÚsala naturalmente cuando sea relevante, sin mencionar que "lo tienes en tus registros".`;
    }
    if(memory.lastSummary){
      memCtx+=`\n\nRESUMEN DE LA ÚLTIMA CONVERSACIÓN:\n${memory.lastSummary}`;
    }
    if(memory.sessionsCount>0){
      memCtx+=`\n\nNota: llevan ${memory.sessionsCount} sesión(es) juntos.`;
    }
    return `Eres Saphira, una psicóloga virtual cálida, empática y especializada en salud mental y bienestar emocional. Siempre en español con tono cercano, compasivo y esperanzador. Usas técnicas de CBT, mindfulness y psicología positiva. Nunca diagnosticas ni prescribes medicamentos. Si hay señales de crisis, responde con mucha empatía y da recursos profesionales. Respuestas de 2-4 oraciones normalmente. El nombre del usuario es ${user.name}.${memCtx}`;
  }

  /* Extraer hechos importantes al finalizar la sesión */
  async function extractMemory(sessionMsgs){
    if(sessionMsgs.length<4)return; // muy pocas mensajes para extraer
    setExtracting(true);
    try{
      const conv=sessionMsgs.map(m=>`${m.role==='user'?user.name:'Saphira'}: ${m.content}`).join('\n');
      const sys=`Analiza esta conversación y extrae SOLO hechos concretos e importantes sobre el usuario que Saphira debería recordar en futuras conversaciones (emociones recurrentes, preocupaciones, logros, eventos de vida, relaciones mencionadas, patrones de comportamiento). Responde SOLO en JSON válido sin markdown: {"facts":["hecho1","hecho2"],"summary":"resumen en 2-3 oraciones de lo que se habló"}. Máximo 8 hechos, cada uno en una línea concisa.`;
      const raw=await callAI([{role:'user',content:`Conversación:\n${conv}`}],sys,600);
      try{
        const parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
        const newMem={
          facts:[...new Set([...(memory.facts||[]),...(parsed.facts||[])].slice(-20))], // max 20 hechos
          lastSummary:parsed.summary||memory.lastSummary,
          sessionsCount:(memory.sessionsCount||0)+1
        };
        setMemory(newMem);
        SM_DATA.saveMemory(user.uid,newMem);
      }catch{}
    }catch{}
    setExtracting(false);
  }

  /* Cerrar y extraer memoria de la sesión */
  const handleClose=()=>{
    const sessionMsgs=msgs.slice(sessionStartRef.current);
    extractMemory(sessionMsgs);
    onClose();
  };

  const send=async()=>{
    const text=inp.trim();
    if(!text||loading)return;
    setInp('');
    const newMsg={role:'user',content:text,ts:Date.now()};
    const newMsgs=[...msgs,newMsg];
    setMsgs(newMsgs);
    setLoading(true);
    try{
      // Enviar solo los últimos 30 mensajes para no exceder el contexto
      const ctxMsgs=newMsgs.slice(-30).map(m=>({role:m.role,content:m.content}));
      const reply=await callAI(ctxMsgs,buildSystemPrompt());
      const final=[...newMsgs,{role:'assistant',content:reply||"Estoy aquí contigo. 💚",ts:Date.now()}];
      setMsgs(final);
      SM_DATA.saveChat(user.uid,final);
    }catch(e){
      const errMsg=e.message?.includes('403')||e.message?.includes('401')
        ?`Para usar el chat IA, esta app debe ejecutarse dentro de Claude.ai (como artifact). En un archivo HTML local, necesitas una API key propia. 💚`
        :`Problema de conexión. Intenta de nuevo. 💚`;
      setMsgs(p=>[...p,{role:'assistant',content:errMsg,ts:Date.now()}]);
    }
    setLoading(false);
    setTimeout(()=>inpRef.current?.focus(),80);
  };

  return(
    <div className="chat-win">
        <div style={{padding:'11px 14px',borderBottom:'1px solid rgba(127,173,127,.16)',display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:'linear-gradient(135deg,#7fad7f,#5a8a5a)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:15}}>🌿</div>
          <div style={{flex:1,minWidth:0}}>
            <p style={{fontWeight:700,color:'var(--deep)',fontSize:13.5,margin:0}}>Saphira</p>
            <p style={{fontSize:10.5,color:'var(--sub)',margin:0}}>
              Asistente de bienestar
              {memory.sessionsCount>0&&<span className="mem-chip" style={{marginLeft:5}}><Ic.brain/> {memory.sessionsCount} sesión{memory.sessionsCount!==1?'es':''}</span>}
            </p>
          </div>
          <button onClick={()=>setShowHist(s=>!s)} style={{background:showHist?'rgba(127,173,127,.15)':'transparent',border:'1px solid rgba(127,173,127,.3)',cursor:'pointer',padding:'5px 8px',borderRadius:9,color:'var(--deep)',display:'flex',alignItems:'center',gap:5,flexShrink:0,transition:'all .2s'}}>
            <Ic.menu/>
            <span style={{fontSize:11,fontWeight:700,color:'var(--sub)'}}>Historial</span>
          </button>
          <button onClick={handleClose} style={{background:'transparent',border:'none',cursor:'pointer',padding:4,color:'var(--sub)',flexShrink:0}}><Ic.x/></button>
        </div>

        {/* ── Panel historial: solo resumen de sesión anterior ── */}
        {showHist&&(
          <div style={{borderBottom:'1px solid rgba(127,173,127,.14)',background:'rgba(245,241,236,.6)',animation:'pgIn .2s ease'}}>
            {/* Si hay resumen de sesión anterior, mostrarlo */}
            {memory.lastSummary?(
              <div style={{padding:'12px 15px'}}>
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
                  <div style={{width:18,height:18,borderRadius:'50%',background:'linear-gradient(135deg,#7fad7f,#5a8a5a)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10}}>🌿</div>
                  <p style={{margin:0,fontSize:11.5,fontWeight:700,color:'var(--deep)'}}>Resumen de tu última sesión</p>
                  <span style={{marginLeft:'auto',fontSize:10,color:'var(--sub)',fontWeight:600}}>
                    {memory.sessionsCount} sesión{memory.sessionsCount!==1?'es':''}
                  </span>
                </div>
                <p style={{margin:0,fontSize:12.5,color:'var(--text)',lineHeight:1.65,fontStyle:'italic',borderLeft:'2px solid var(--sage)',paddingLeft:10}}>
                  {memory.lastSummary}
                </p>
                {extracting&&(
                  <p style={{margin:'8px 0 0',fontSize:11,color:'var(--sage-d)',fontWeight:600,display:'flex',alignItems:'center',gap:4}}>
                    <span className="dot" style={{width:4,height:4}}/> Actualizando memoria…
                  </p>
                )}
              </div>
            ):(
              <div style={{padding:'12px 15px',textAlign:'center'}}>
                <p style={{margin:0,fontSize:12.5,color:'var(--sub)',lineHeight:1.6}}>
                  {extracting
                    ?'✨ Guardando resumen de esta sesión…'
                    :'Esta es tu primera sesión con Saphira. Al cerrar el chat, se guardará un resumen automáticamente.'}
                </p>
              </div>
            )}
          </div>
        )}

        <div className="chat-msgs">
          {msgs.map((m,i)=>(
            <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',marginBottom:8}}>
              {m.role==='assistant'&&<div style={{width:24,height:24,borderRadius:'50%',background:'linear-gradient(135deg,#7fad7f,#5a8a5a)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginRight:6,fontSize:12}}>🌿</div>}
              <div className={m.role==='user'?'bub-u':'bub-a'}>{m.content}</div>
            </div>
          ))}
          {loading&&(
            <div style={{display:'flex',marginBottom:8}}>
              <div style={{width:24,height:24,borderRadius:'50%',background:'linear-gradient(135deg,#7fad7f,#5a8a5a)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginRight:6,fontSize:12}}>🌿</div>
              <div className="bub-a" style={{padding:'10px 13px'}}><span className="dot"/><span className="dot"/><span className="dot"/></div>
            </div>
          )}
          <div ref={bottomRef}/>
        </div>

        <div style={{padding:'9px 12px',borderTop:'1px solid rgba(127,173,127,.13)',display:'flex',gap:7,alignItems:'center'}}>
          <input ref={inpRef} className="inp" style={{padding:'9px 13px',fontSize:13}} placeholder="¿Cómo te sientes hoy?" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()} disabled={loading}/>
          <button onClick={send} disabled={loading||!inp.trim()} style={{width:36,height:36,borderRadius:'50%',background:inp.trim()?'linear-gradient(135deg,#7fad7f,#5a8a5a)':'rgba(127,173,127,.22)',border:'none',cursor:inp.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .25s',flexShrink:0,color:'white'}}>
            <Ic.send/>
          </button>
        </div>
      </div>
  );
}

function Diary({user,entries,setEntries,onPublish}){
  const[text,setText]=useState('');
  const[mood,setMood]=useState(null);
  const[open,setOpen]=useState(false);
  const[publishedIds,setPublishedIds]=useState([]);
  const[insights,setInsights]=useState({});
  const[loadingId,setLoadingId]=useState(null);
  const[streak,setStreak]=useState(()=>getStreakData(user.uid));

  const save=()=>{
    if(!text.trim())return;
    const e={id:Date.now(),text:text.trim(),mood,ts:Date.now()};
    const next=[e,...entries];
    setEntries(next);
    SM_DATA.set(user.uid,'diary',next);
    setStreak(updateStreak(user.uid,user.tz));
    analyzeEntry(e);
    setText('');setMood(null);setOpen(false);
  };

  const analyzeEntry=async(entry)=>{
    setLoadingId(entry.id);
    try{
      const sys=`Eres Saphira, psicóloga empática. Analiza esta entrada de diario y responde en español con: una reflexión cálida breve, una pregunta reflexiva y un consejo práctico. Sin numeración, párrafos cortos, máximo 80 palabras.`;
      const moodLabel=entry.mood?MOODS.find(m=>m.e===entry.mood)?.l:'';
      const insight=await callAI([{role:'user',content:`Entrada${moodLabel?' ('+moodLabel+')':''}:\n${entry.text}`}],sys,400);
      setInsights(p=>({...p,[entry.id]:insight}));
    }catch{setInsights(p=>({...p,[entry.id]:"No pude conectar ahora, pero tu reflexión está guardada. 💚"}));}
    setLoadingId(null);
  };

  return(
    <div className="page-in">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <p className="lora" style={{fontSize:21,fontWeight:600,color:'var(--deep)',margin:0}}>Mi Diario 📔</p>

      </div>
      <div className="glass rounded-2xl" style={{padding:'11px 15px',marginBottom:13,display:'flex',alignItems:'center',gap:9}}>
        <span style={{fontSize:21}}>🔥</span>
        <p style={{margin:0,fontSize:13,fontWeight:700,color:'var(--deep)'}}>Racha actual: {streak.count} día{streak.count!==1?'s':''} seguido{streak.count!==1?'s':''}</p>
      </div>
      {open&&(
        <div className="glass rounded-3xl" style={{padding:'17px 19px',marginBottom:13,animation:'pgIn .3s ease'}}>
          <p style={{fontWeight:700,color:'var(--deep)',marginBottom:9,fontSize:13.5}}>¿Cómo te sientes hoy?</p>
          <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:12}}>{MOODS.map(m=><button key={m.e} className={`mood-b ${mood===m.e?'sel':''}`} onClick={()=>setMood(mood===m.e?null:m.e)} title={m.l}>{m.e}</button>)}</div>
          <textarea className="inp" placeholder="Escribe lo que sientes... Sin juicios." value={text} onChange={e=>setText(e.target.value)}/>
          <div style={{display:'flex',gap:8,marginTop:10,justifyContent:'flex-end'}}>
            <button className="btn-s" onClick={()=>{setOpen(false);setText('');setMood(null);}}>Cancelar</button>
            <button className="btn-p" onClick={save} disabled={!text.trim()}>Guardar + Analizar ✨</button>
          </div>
        </div>
      )}
      {entries.length===0&&!open&&(
        <div className="glass rounded-3xl" style={{padding:'42px 22px',textAlign:'center'}}>
          <div style={{fontSize:46,marginBottom:10}}>📖</div>
          <p className="lora" style={{fontSize:17,color:'var(--deep)',marginBottom:5}}>Tu diario te espera</p>
          <p style={{color:'var(--sub)',fontSize:13,lineHeight:1.7}}>Escribe tu primera entrada. Saphira la analizará con IA.</p>
        </div>
      )}
      {entries.map(e=>(
        <div key={e.id} className="card">
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:9,marginBottom:9}}>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              {e.mood&&<span style={{fontSize:18}}>{e.mood}</span>}
              <span style={{fontSize:11.5,fontWeight:600,color:'var(--sub)'}}>{MOODS.find(m=>m.e===e.mood)?.l||''}</span>
            </div>
            {publishedIds.includes(e.id)
              ?<span className="tag tag-g"><Ic.check/> Publicado</span>
              :<button onClick={()=>{setPublishedIds(p=>[...p,e.id]);onPublish(e);}} style={{display:'flex',alignItems:'center',gap:4,background:'rgba(127,173,127,.1)',border:'1px solid rgba(127,173,127,.32)',borderRadius:50,padding:'3px 11px',cursor:'pointer',fontSize:11.5,color:'var(--deep)',fontWeight:600,whiteSpace:'nowrap'}}><Ic.share/> Publicar</button>
            }
          </div>
          <p style={{margin:'0 0 8px',color:'var(--text)',lineHeight:1.7,fontSize:13.5,whiteSpace:'pre-wrap'}}>{e.text}</p>
          <p style={{margin:'0 0 8px',fontSize:11,color:'#b0a090'}}>🕐 {fmtDT(e.ts,user.tz)}</p>
          {loadingId===e.id&&<div className="ai-insight"><span className="ai-badge"><Ic.ai/> Saphira analizando…</span><div style={{display:'flex',gap:4,marginTop:7}}><span className="dot"/><span className="dot"/><span className="dot"/></div></div>}
          {insights[e.id]&&loadingId!==e.id&&(
            <div className="ai-insight">
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:7}}>
                <div style={{width:19,height:19,borderRadius:'50%',background:'linear-gradient(135deg,#7fad7f,#5a8a5a)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10}}>🌿</div>
                <span className="ai-badge"><Ic.ai/> Reflexión de Saphira</span>
              </div>
              <p style={{margin:0,fontSize:12.5,color:'var(--deep)',lineHeight:1.7,whiteSpace:'pre-wrap'}}>{insights[e.id]}</p>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function ForumPost({post,user}){
  const[reaction,setReaction]=useState(null);
  const[likes,setLikes]=useState(post.likes||0);
  const[dislikes,setDislikes]=useState(post.dislikes||0);
  const[commentText,setCommentText]=useState('');
  const[replyTo,setReplyTo]=useState(null);
  const[comments,setComments]=useState(post.comments||[]);
  const[showInput,setShowInput]=useState(false);
  const[modResult,setModResult]=useState(null);

  useEffect(()=>{if(post.uid!=='u_sys'&&post.uid!=='u_sys2')modPost();},[]);

  const modPost=async()=>{
    try{
      const sys=`Moderador de bienestar. Responde SOLO JSON sin markdown: {"safe":true,"tone":"positivo","warning":null}`;
      const raw=await callAI([{role:'user',content:`Post: "${post.text.slice(0,300)}"`}],sys,150);
      try{setModResult(JSON.parse(raw.replace(/```json|```/g,'').trim()));}catch{}
    }catch{}
  };

  const handleLike=()=>{
    if(reaction==='like'){setReaction(null);setLikes(n=>n-1);}
    else{if(reaction==='dislike')setDislikes(n=>n-1);setReaction('like');setLikes(n=>n+1);}
  };
  const handleDislike=()=>{
    if(reaction==='dislike'){setReaction(null);setDislikes(n=>n-1);}
    else{if(reaction==='like')setLikes(n=>n-1);setReaction('dislike');setDislikes(n=>n+1);}
  };

  const submitComment=()=>{
    if(!commentText.trim())return;
    setComments(p=>[...p,{id:Date.now(),uid:'me',name:user.name,initials:user.initials,avatar:user.avatar,text:commentText.trim(),ts:Date.now(),replyTo}]);
    setCommentText('');setReplyTo(null);setShowInput(false);
  };

  return(
    <div className="card">
      {modResult&&!modResult.safe&&(
        <div style={{background:'rgba(255,220,180,.3)',border:'1px solid rgba(220,150,80,.32)',borderRadius:9,padding:'7px 11px',marginBottom:10,display:'flex',gap:7}}>
          <span style={{fontSize:14}}>⚠️</span>
          <div><p style={{margin:0,fontWeight:700,fontSize:11.5,color:'#8a5a20'}}>Aviso de Saphira</p><p style={{margin:'2px 0 0',fontSize:12,color:'#7a4a10',lineHeight:1.5}}>{modResult.warning}</p></div>
        </div>
      )}
      <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:11}}>
        <Av user={{name:post.name,initials:post.initials,avatar:post.avatar}} size={38}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
            <p style={{margin:0,fontWeight:700,color:'var(--deep)',fontSize:13.5}}>{post.name}</p>
            {modResult&&<span className="mod-badge" style={{color:modResult.tone==='positivo'?'var(--sage-d)':modResult.tone==='negativo'?'#b07060':'var(--sub)'}}><Ic.shield/>{modResult.tone}</span>}
          </div>
          <p style={{margin:'1px 0 0',fontSize:11,color:'var(--sub)'}}>{fmtDT(post.ts,user.tz)}</p>
        </div>
        {post.mood&&<span style={{fontSize:18}}>{post.mood}</span>}
      </div>
      <p style={{margin:'0 0 11px',color:'var(--text)',lineHeight:1.7,fontSize:13.5,whiteSpace:'pre-wrap'}}>{post.text}</p>
      <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:comments.length>0?10:0}}>
        <button className={`react-btn react-btn-like ${reaction==='like'?'active':''}`} onClick={handleLike}><Ic.heart/> {likes}</button>
        <button className={`react-btn react-btn-dislike ${reaction==='dislike'?'active':''}`} onClick={handleDislike}><Ic.thumbDown/> {dislikes}</button>
        <button onClick={()=>{setShowInput(s=>!s);setReplyTo(null);}} style={{display:'flex',alignItems:'center',gap:4,background:'transparent',border:'1px solid rgba(127,173,127,.28)',borderRadius:50,padding:'4px 11px',cursor:'pointer',fontSize:12,color:'var(--sub)',fontWeight:600}}><Ic.reply/> Comentar</button>
      </div>
      {comments.length>0&&(
        <div style={{marginTop:8,paddingTop:8,borderTop:'1px solid rgba(127,173,127,.1)',display:'grid',gap:7}}>
          {comments.map(c=>(
            <div key={c.id} style={{display:'flex',gap:7,alignItems:'flex-start'}}>
              <Av user={{name:c.name,initials:c.initials,avatar:c.avatar}} size={26}/>
              <div style={{flex:1}}>
                {c.replyTo&&<div style={{background:'rgba(127,173,127,.09)',borderLeft:'3px solid var(--sage)',borderRadius:'0 7px 7px 0',padding:'4px 9px',marginBottom:4}}><span style={{fontSize:11,fontWeight:700,color:'var(--deep)'}}>{c.replyTo.name}: </span><span style={{fontSize:11,color:'var(--sub)'}}>{c.replyTo.text?.slice(0,50)}…</span></div>}
                <div style={{background:'rgba(245,241,236,.8)',borderRadius:'3px 13px 13px 13px',padding:'6px 10px',display:'inline-block',maxWidth:'100%'}}>
                  <p style={{margin:'0 0 1px',fontWeight:700,fontSize:11.5,color:'var(--deep)'}}>{c.name}</p>
                  <p style={{margin:0,fontSize:12.5,color:'var(--text)',lineHeight:1.55}}>{c.text}</p>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8,marginTop:3}}>
                  <span style={{fontSize:10.5,color:'var(--sub)'}}>{fmtDT(c.ts,user.tz)}</span>
                  <button onClick={()=>{setReplyTo({name:c.name,text:c.text});setShowInput(true);}} style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'var(--sage)',fontWeight:600,padding:0}}>Responder</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
      {showInput&&(
        <div style={{marginTop:10,animation:'pgIn .22s ease'}}>
          {replyTo&&(
            <div style={{background:'rgba(127,173,127,.09)',borderLeft:'3px solid var(--sage)',borderRadius:'0 9px 9px 0',padding:'6px 10px',marginBottom:6,display:'flex',alignItems:'center',gap:7}}>
              <div style={{flex:1,minWidth:0}}><p style={{margin:0,fontWeight:700,fontSize:11.5,color:'var(--deep)'}}>{replyTo.name}</p><p style={{margin:0,fontSize:11.5,color:'var(--sub)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{replyTo.text}</p></div>
              <button onClick={()=>setReplyTo(null)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--sub)'}}><Ic.x/></button>
            </div>
          )}
          <div style={{display:'flex',gap:6,alignItems:'flex-end'}}>
            <Av user={user} size={26}/>
            <input className="inp" style={{padding:'8px 12px',fontSize:12.5,flex:1}} placeholder={replyTo?`Responder a ${replyTo.name}...`:"Escribe un comentario..."} value={commentText} onChange={e=>setCommentText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&submitComment()} autoFocus/>
            <button onClick={submitComment} disabled={!commentText.trim()} style={{width:33,height:33,borderRadius:'50%',background:commentText.trim()?'linear-gradient(135deg,#7fad7f,#5a8a5a)':'rgba(127,173,127,.22)',border:'none',cursor:commentText.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,color:'white',transition:'all .22s'}}>
              <Ic.send/>
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function Forum({user,posts,setPosts}){
  const[text,setText]=useState('');
  const[mood,setMood]=useState(null);
  const[open,setOpen]=useState(false);
  const submit=()=>{
    if(!text.trim())return;
    const p={id:Date.now(),uid:user.uid,name:user.name,initials:user.initials,avatar:user.avatar,text:text.trim(),ts:Date.now(),mood,likes:0,dislikes:0,comments:[]};
    const next=[p,...posts];
    setPosts(next);
    const myPosts=next.filter(x=>x.uid===user.uid);
    SM_DATA.set(user.uid,'posts',myPosts);
    setText('');setMood(null);setOpen(false);
  };
  return(
    <div className="page-in">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div>
          <p className="lora" style={{fontSize:21,fontWeight:600,color:'var(--deep)',margin:0}}>Comunidad 🫂</p>
          <p style={{margin:'2px 0 0',color:'var(--sub)',fontSize:12}}>Comparte · Moderado por IA</p>
        </div>
        <button className="btn-p" style={{display:'flex',alignItems:'center',gap:5,padding:'8px 15px',fontSize:12.5}} onClick={()=>setOpen(o=>!o)}><Ic.plus/> Publicar</button>
      </div>
      {open&&(
        <div className="glass rounded-3xl" style={{padding:'17px 19px',marginBottom:13,animation:'pgIn .3s ease'}}>
          <p style={{fontWeight:700,color:'var(--deep)',marginBottom:9,fontSize:13.5}}>¿Qué quieres compartir?</p>
          <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:10}}>{MOODS.map(m=><button key={m.e} className={`mood-b ${mood===m.e?'sel':''}`} onClick={()=>setMood(mood===m.e?null:m.e)} title={m.l}>{m.e}</button>)}</div>
          <textarea className="inp" placeholder="Comparte cómo te sientes, un aprendizaje o una reflexión..." value={text} onChange={e=>setText(e.target.value)}/>
          <div style={{display:'flex',gap:8,marginTop:10,justifyContent:'flex-end'}}>
            <button className="btn-s" onClick={()=>{setOpen(false);setText('');setMood(null);}}>Cancelar</button>
            <button className="btn-p" onClick={submit} disabled={!text.trim()}>Publicar</button>
          </div>
        </div>
      )}
      {posts.map(p=><ForumPost key={p.id} post={p} user={user}/>)}
    </div>
  );
}

/* ══════════════════════════════════════
   SETTINGS
══════════════════════════════════════ */
function Settings({user,setUser,onLogout}){
  const[form,setForm]=useState({name:user.name,tz:user.tz,avatar:user.avatar});
  const[saved,setSaved]=useState(false);
  const dirty=form.name!==user.name||form.tz!==user.tz||form.avatar!==user.avatar;
  const apply=()=>{
    if(!form.name.trim())return;
    const upd=SM_AUTH.updateProfile(user.uid,{name:form.name.trim(),tz:form.tz,avatar:form.avatar});
    setUser(upd);setSaved(true);setTimeout(()=>setSaved(false),2200);
  };
  const handleFile=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setForm(p=>({...p,avatar:ev.target.result}));r.readAsDataURL(f);};
  return(
    <div className="page-in">
      <p className="lora" style={{fontSize:21,fontWeight:600,color:'var(--deep)',marginBottom:16}}>Mi Perfil ⚙️</p>
      <div className="glass rounded-3xl" style={{padding:'19px',marginBottom:11}}>
        <p style={{fontWeight:700,color:'var(--deep)',marginBottom:12,fontSize:13}}>Foto de perfil</p>
        <div style={{display:'flex',alignItems:'center',gap:14}}>
          <label style={{cursor:'pointer'}}><Av user={{name:form.name,initials:form.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2),avatar:form.avatar}} size={64}/><input type="file" accept="image/*" style={{display:'none'}} onChange={handleFile}/></label>
          <div><p style={{margin:0,fontWeight:700,color:'var(--deep)',fontSize:14}}>{form.name||user.name}</p><p style={{margin:'3px 0 0',fontSize:12,color:'var(--sub)'}}>Toca para cambiar</p></div>
        </div>
      </div>
      <div className="glass rounded-3xl" style={{padding:'19px',marginBottom:11}}>
        <p style={{fontWeight:700,color:'var(--deep)',marginBottom:12,fontSize:13}}>Información personal</p>
        <div style={{display:'grid',gap:11}}>
          <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'var(--sub)',marginBottom:5}}>Nombre</label><input className="inp" value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))}/></div>
          <div><label style={{display:'block',fontSize:12,fontWeight:600,color:'var(--sub)',marginBottom:5}}>Zona horaria</label><select className="inp" value={form.tz} onChange={e=>setForm(p=>({...p,tz:e.target.value}))}>{TZS.map(t=><option key={t} value={t}>{t.replace(/_/g,' ')}</option>)}</select></div>
          {dirty&&<button className="btn-p" style={{width:'100%'}} onClick={apply}>{saved?<span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6}}><Ic.check/> Guardado</span>:'✅ Guardar cambios'}</button>}
          {!dirty&&saved&&<p style={{textAlign:'center',color:'var(--sage-d)',fontSize:13,fontWeight:600,margin:0}}>✓ Perfil actualizado</p>}
        </div>
      </div>
      <button onClick={onLogout} style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:7,background:'rgba(200,100,80,.07)',border:'1px solid rgba(200,100,80,.2)',borderRadius:50,padding:'11px',cursor:'pointer',fontFamily:'Nunito,sans-serif',fontSize:13.5,fontWeight:600,color:'#b05040',transition:'all .25s'}}>
        <Ic.logout/> Cerrar sesión
      </button>
    </div>
  );
}

/* ══════════════════════════════════════
   CUESTIONARIO
   10 preguntas de opción múltiple (A-D).
   Al finalizar calcula monedas según
   aciertos (0=0 ... 10=100, +10 por acierto)
   y actualiza el saldo global del usuario.
══════════════════════════════════════ */
function Quiz({user,coins,setCoins}){
  const[answers,setAnswers]=useState(Array(QUIZ_QUESTIONS.length).fill(null));
  const[submitted,setSubmitted]=useState(false);
  const[result,setResult]=useState(null);
  const letters=['A','B','C','D'];

  const selectAnswer=(qIdx,optIdx)=>{
    if(submitted)return;
    setAnswers(prev=>{const next=[...prev];next[qIdx]=optIdx;return next;});
  };

  const allAnswered=answers.every(a=>a!==null);

  const submitQuiz=()=>{
    if(!allAnswered||submitted)return;
    let correctCount=0;
    QUIZ_QUESTIONS.forEach((q,i)=>{if(answers[i]===q.correct)correctCount++;});
    const earned=correctCount*10;
    const newBalance=addCoins(user.uid,earned);
    setCoins(newBalance);
    setResult({correctCount,earned,newBalance});
    setSubmitted(true);
  };

  const restart=()=>{
    setAnswers(Array(QUIZ_QUESTIONS.length).fill(null));
    setSubmitted(false);
    setResult(null);
  };

  return(
    <div className="page-in">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div>
          <p className="lora" style={{fontSize:21,fontWeight:600,color:'var(--deep)',margin:0}}>Cuestionario 🧠</p>
          <p style={{margin:'2px 0 0',color:'var(--sub)',fontSize:12}}>Pon a prueba lo que sabes sobre bienestar</p>
        </div>
        <span className="coin-badge"><Ic.coin/> {coins}</span>
      </div>

      {result&&(
        <div className="glass rounded-3xl" style={{padding:'19px',marginBottom:16,textAlign:'center',animation:'pgIn .3s ease'}}>
          <div style={{fontSize:38,marginBottom:6}}>{result.correctCount>=8?'🏆':result.correctCount>=5?'🌟':'🌱'}</div>
          <p className="lora" style={{fontSize:18,fontWeight:600,color:'var(--deep)',margin:0}}>¡Cuestionario completado!</p>
          <div className="stat-grid" style={{marginTop:14}}>
            <div className="glass rounded-2xl" style={{padding:'12px 10px'}}>
              <p style={{margin:0,fontSize:11.5,color:'var(--sub)',fontWeight:600}}>Respuestas correctas</p>
              <p style={{margin:'4px 0 0',fontSize:19,fontWeight:700,color:'var(--deep)'}}>{result.correctCount} / {QUIZ_QUESTIONS.length}</p>
            </div>
            <div className="glass rounded-2xl" style={{padding:'12px 10px'}}>
              <p style={{margin:0,fontSize:11.5,color:'var(--sub)',fontWeight:600}}>Monedas obtenidas</p>
              <p style={{margin:'4px 0 0',fontSize:19,fontWeight:700,color:'#7a5a20'}}>+{result.earned} 🪙</p>
            </div>
          </div>
          <p style={{margin:'12px 0 0',fontSize:13,color:'var(--sub)'}}>Nuevo saldo: <strong style={{color:'var(--deep)'}}>{result.newBalance} monedas</strong></p>
          <button className="btn-p" style={{marginTop:14}} onClick={restart}>Intentar de nuevo</button>
        </div>
      )}

      {!result&&QUIZ_QUESTIONS.map((q,qIdx)=>(
        <div key={qIdx} className="card">
          <p style={{margin:'0 0 11px',fontWeight:700,color:'var(--deep)',fontSize:13.5}}>{qIdx+1}. {q.q}</p>
          {q.options.map((opt,optIdx)=>{
            const isSel=answers[qIdx]===optIdx;
            return(
              <div key={optIdx} className={`quiz-opt ${isSel?'sel':''}`} onClick={()=>selectAnswer(qIdx,optIdx)}>
                <span className="quiz-letter">{letters[optIdx]}</span>
                <span style={{flex:1,paddingTop:2}}>{opt}</span>
              </div>
            );
          })}
        </div>
      ))}

      {!result&&(
        <button className="btn-p" style={{width:'100%',marginTop:6}} onClick={submitQuiz} disabled={!allAnswered}>
          {allAnswered?'Enviar respuestas ✨':`Responde todas las preguntas (${answers.filter(a=>a!==null).length}/${QUIZ_QUESTIONS.length})`}
        </button>
      )}
    </div>
  );
}

/* ══════════════════════════════════════
   ROOT APP
══════════════════════════════════════ */
function App(){
  const[user,setUser]=useState(null);
  const[booting,setBooting]=useState(true);
  const[page,setPage]=useState('home');
  const[diary,setDiary]=useState([]);
  const[posts,setPosts]=useState(INIT_FORUM);
  const[chatMsgs,setChatMsgs]=useState([]);
  const[memory,setMemory]=useState({facts:[],lastSummary:null,sessionsCount:0});
  const[chatOpen,setChatOpen]=useState(false);
  const[newPost,setNewPost]=useState(false);
  const[coins,setCoins]=useState(0);

  /* Auto-login con sesión guardada */
  useEffect(()=>{
    SM_AUTH.resumeSession().then(u=>{
      if(u)loadUser(u);
      setBooting(false);
    });
  },[]);

  const loadUser=useCallback((u)=>{
    setUser(u);
    setDiary(SM_DATA.get(u.uid,'diary',[]));
    const myPosts=SM_DATA.get(u.uid,'posts',[]);
    setPosts([...myPosts,...INIT_FORUM]);
    setChatMsgs(SM_DATA.getChat(u.uid,u.name));
    setMemory(SM_DATA.getMemory(u.uid));
    setCoins(getCoins(u.uid));
    setPage('home');
  },[]);

  const handleLogout=()=>{
    SM_AUTH.logout();
    setUser(null);setDiary([]);setPosts(INIT_FORUM);
    setChatMsgs([]);setMemory({facts:[],lastSummary:null,sessionsCount:0});
    setChatOpen(false);setPage('home');
    setCoins(0);
  };

  const publishToForum=useCallback((entry)=>{
    const p={id:Date.now(),uid:user.uid,name:user.name,initials:user.initials,avatar:user.avatar,text:entry.text,ts:Date.now(),mood:entry.mood,likes:0,dislikes:0,comments:[]};
    setPosts(prev=>{
      const next=[p,...prev];
      SM_DATA.set(user.uid,'posts',next.filter(x=>x.uid===user.uid));
      return next;
    });
    setNewPost(true);
  },[user]);

  if(booting)return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
      <div className="bg-canvas"/>
      <div style={{textAlign:'center',position:'relative',zIndex:1}}>
        <div style={{width:48,height:48,borderRadius:'50%',background:'linear-gradient(135deg,#7fad7f,#5a8a5a)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',animation:'fabPulse 1.5s ease-in-out infinite'}}><Ic.leaf/></div>
        <p className="lora" style={{fontSize:18,color:'var(--deep)'}}>MindSpace</p>
      </div>
    </div>
  );

  if(!user)return<AuthScreen onLogin={loadUser}/>;

  const nav=[
    {id:'home',icon:Ic.home},{id:'diary',icon:Ic.book},
    {id:'forum',icon:Ic.forum,badge:newPost},{id:'quiz',icon:Ic.quiz},{id:'settings',icon:Ic.settings},
  ];

  return(
    <div style={{minHeight:'100vh',position:'relative'}}>
      <div className="bg-canvas"/>
      <div style={{position:'fixed',width:280,height:280,borderRadius:'50%',background:'#bdd9bd',filter:'blur(65px)',opacity:.28,top:0,right:0,pointerEvents:'none',zIndex:0}}/>
      <div style={{position:'fixed',width:240,height:240,borderRadius:'50%',background:'#e8c4b8',filter:'blur(65px)',opacity:.24,bottom:'8%',left:0,pointerEvents:'none',zIndex:0}}/>

      <header className="glass-header" style={{position:'sticky',top:0,zIndex:50,padding:'0 14px'}}>
        <div style={{maxWidth:720,margin:'0 auto',height:56,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:7}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:'linear-gradient(135deg,#7fad7f,#5a8a5a)',display:'flex',alignItems:'center',justifyContent:'center'}}><Ic.leaf/></div>
            <span className="lora" style={{fontWeight:600,fontSize:15.5,color:'var(--deep)'}}>MindSpace</span>
          </div>
          <nav style={{display:'flex',gap:1}}>
            {nav.map(n=>(
              <button key={n.id} className={`nav-btn ${page===n.id?'on':''}`} onClick={n.id==='forum'?()=>{setPage('forum');setNewPost(false);}:()=>setPage(n.id)}>
                <n.icon/>
                {n.badge&&<span style={{width:6,height:6,borderRadius:'50%',background:'var(--blush)',flexShrink:0}}/>}
              </button>
            ))}
          </nav>
          <div onClick={()=>setPage('settings')} style={{cursor:'pointer',display:'flex',alignItems:'center',gap:9}}>
            <span className="coin-badge"><Ic.coin/> {coins}</span>
            <Av user={user} size={29}/>
          </div>
        </div>
      </header>

      <main style={{maxWidth:720,margin:'0 auto',padding:'18px 13px 110px'}}>
        {page==='home'&&<Dashboard user={user}/>}
        {page==='diary'&&<Diary user={user} entries={diary} setEntries={setDiary} onPublish={publishToForum}/>}
        {page==='forum'&&<Forum user={user} posts={posts} setPosts={setPosts}/>}
        {page==='quiz'&&<Quiz user={user} coins={coins} setCoins={setCoins}/>}
        {page==='settings'&&<Settings user={user} setUser={setUser} onLogout={handleLogout}/>}
      </main>

      <button className="fab" onClick={()=>setChatOpen(o=>!o)} title="Hablar con Saphira">
        {chatOpen?<Ic.x/>:<Ic.sparkle/>}
      </button>

      {chatOpen&&(
        <AIChat
          user={user}
          msgs={chatMsgs}
          setMsgs={setChatMsgs}
          memory={memory}
          setMemory={setMemory}
          onClose={()=>setChatOpen(false)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
